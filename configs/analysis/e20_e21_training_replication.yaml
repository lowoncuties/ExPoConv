global_embargo:
  experiments: [E20, E21]
  scope: all_individual_and_aggregate_official_test_endpoint_values
  required_successful_runs: 60
  required_complete_pairs: 30
  gate_is_joint_across_experiments: true
  development_health_monitoring_allowed: true
  allowed_health_fields:
    - status
    - epoch
    - update
    - expected_updates
    - loss_is_finite
    - gradient_is_finite
    - parameters_are_finite
    - optimizer_state_is_finite
    - development_output_is_finite
    - checkpoint_inventory
    - protocol_version
    - config_hash
    - code_commit
    - code_dirty
    - runtime_identity
    - physical_gpu_identity
  embargoed_material:
    - fixed_final_official_test_values
    - validation_best_official_test_values
    - duplicate_excluded_official_test_values
    - individual_predictions
    - individual_endpoint_tables
    - aggregate_endpoint_tables
    - endpoint_figures
  release_rule: >-
    Release only after every registered E20 and E21 R/F run is status ok,
    complete at its exact update budget, finite, checkpoint-complete, and
    provenance-compatible with this manifest.

