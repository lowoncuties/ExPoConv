estimands:
  primary_task_quality:
    experiments: [E20, E21]
    endpoint: fixed_final_update
    test_partition: official_test
    metrics:
      E20: mean_per_image_foreground_dice
      E21: top1_accuracy
    inferential_unit: matched_seed_pair
    paired_difference: F_minus_R
    point_estimator: arithmetic_mean_of_15_paired_differences
    interval: two_sided_95_percent_student_t_on_paired_differences
    degrees_of_freedom: 14
    interval_adjustment: none
    formal_noninferiority: false
    equivalence_margin: null
    machine_scale: zero_to_one

  secondary_task_quality:
    paired_difference: F_minus_R
    endpoint_partition_pairs:
      - {endpoint: validation_best, test_partition: official_test}
      - {endpoint: fixed_final_update, test_partition: official_test_excluding_exact_training_duplicates}
      - {endpoint: validation_best, test_partition: official_test_excluding_exact_training_duplicates}
    additional_metric:
      experiment: E20
      metric: mean_per_image_foreground_iou
      endpoints: [fixed_final_update, validation_best]
      test_partitions: [official_test, official_test_excluding_exact_training_duplicates]
    sensitivity_statistics:
      - median_paired_difference
      - exact_two_sided_sign_test_omitting_exact_ties
      - paired_seed_bootstrap_percentile_interval
    interval_adjustment: none

  primary_training_efficiency:
    experiments: [E20, E21]
    measurement: compute_seconds
    inferential_unit: matched_seed_pair
    seed_ratio: R_over_F
    point_estimator: geometric_mean_of_15_seed_ratios
    interval: exponentiated_two_sided_95_percent_student_t_on_log_ratios
    degrees_of_freedom: 14
    interval_adjustment: none

  secondary_training_efficiency:
    experiments: [E20, E21]
    measurement: elapsed_seconds
    inferential_unit: matched_seed_pair
    seed_ratio: R_over_F
    point_estimator: geometric_mean_of_15_seed_ratios
    interval: exponentiated_two_sided_95_percent_student_t_on_log_ratios
    degrees_of_freedom: 14
    interval_adjustment: none

cross_platform_reporting:
  primary_reporting: separate_cohort_estimates
  task_strata:
    isic16_poincare_unet: [E09, E20]
    cifar100_poincare_resnet20: [E10, E21]
  display: forest_without_pooled_diamond
  grand_pooled_estimate: prohibited
  pooled_hypothesis_test: prohibited
  inverse_variance_fixed_effect: prohibited
  random_effects: prohibited
  causal_platform_contrast: prohibited
  cross_task_pooling: prohibited
  rationale: >-
    Two platform/cohort strata do not support stable random-effects inference;
    a fixed-effect estimate would impose an unregistered common-effect
    assumption, and platform is confounded with the disjoint seed cohorts.

failure_policy:
  replace_failed_seeds: false
  complete_case_primary_analysis: prohibited
  pre_update_infrastructure_failure:
    retry_same_seed_and_variant: allowed
    retain_every_attempt: true
    accepted_retry_must_match_frozen_identity: true
    failed_attempt_must_be_registered_before_endpoint_unblinding: true
    registration_section: supplemental_attempt_evidence
    immutable_evidence_archive_required: true
    file_sha256_registration_required: true
    complete_identity_registration_required: true
    unregistered_attempt_disposition: keep_global_embargo_closed
  external_interruption_after_updates:
    exact_checkpoint_resume: allowed
    retain_every_attempt: true
    provenance_match_required: true
    immutable_contemporaneous_checkpoint_required: true
    interruption_evidence_required: true
    archive_and_register_before_endpoint_unblinding: true
    registration_section: supplemental_attempt_evidence
    file_sha256_registration_required: true
    complete_identity_registration_required: true
    unregistered_attempt_disposition: keep_global_embargo_closed
    currently_registered_attempts: 0
  scientific_or_nonfinite_failure:
    retry_to_obtain_endpoint: prohibited
    disposition: terminal_registered_failure
  unresolved_or_incompatible_run:
    disposition: keep_global_embargo_closed_and_report_campaign_incomplete

required_outputs:
  gate_audit: e20_e21_gate_audit.json
  run_audit: e20_e21_run_audit.csv
  endpoint_rows: e20_e21_training_runs.csv
  variant_summary: e20_e21_training_variant_summary.csv
  paired_quality_by_seed: e20_e21_paired_quality_by_seed.csv
  paired_quality: e20_e21_paired_quality_summary.csv
  paired_iou: e20_paired_iou_summary.csv
  paired_efficiency_by_seed: e20_e21_paired_training_efficiency_by_seed.csv
  paired_efficiency: e20_e21_paired_training_efficiency_summary.csv
  platform_strata: e09_e10_e20_e21_platform_strata.csv
  forest_figure_stem: e09_e10_e20_e21_quality_strata
  audit_summary: e20_e21_analysis_summary.json

cuda12_description_erratum:
  affected_configurations:
    - configs/training/e20_isic16_unet_rf_replication.yaml
    - configs/training/e21_cifar100_resnet20_rf_replication.yaml
  stale_phrase: secondary CUDA-12 platform
  authoritative_runtime: >-
    JAX/JAXLIB 0.4.25 with pinned CUDA-11.8 and cuDNN-8.6 user-space
    libraries on the registered RTX A6000 physical GPU.
