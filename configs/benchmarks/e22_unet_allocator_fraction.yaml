schema_version: "1.0"
experiment_id: E22
description: "Revision R1 rerun of selected E13 R/F Poincare U-Net complete-update workloads with the JAX GPU allocator fraction raised from the default 0.75 to 0.95 (XLA_PYTHON_CLIENT_MEM_FRACTION=0.95, set by scripts/run_e22.sh and recorded in provenance)."
campaign_scope: "Test whether the E13 512-by-512 batch-8 reference out-of-memory outcome depends on the default allocator cap, add a 512-by-512 batch-16 workload whose reference requirement exceeds physical device memory, and repeat the 256-by-256 batch-8 pivot as a same-allocator control against E13. Model, loss, optimizer, precision, timing boundary, sessions, warmup, and observation counts are unchanged from E13; retain every explicit OOM or failure."
variants: [R, F]
sessions: 5
warmup_calls: 50
timed_calls_per_session: 200
require_idle_gpu: true
max_preexisting_memory_mib: 512
max_preexisting_utilization_percent: 5
memory_budget_bytes: 34359738368
shared_state_policy: "Within each session, R and F receive identical deterministic initial parameters, inputs, targets, and optimizer state, then evolve independently through the same number of complete updates."
timing_scope: "Each synchronized call includes loss, reverse-mode gradients, gradient clipping, coupled L2, and a complete Adam update; compilation, initialization, and host transfer are excluded from steady-state latency."
memory_evidence_policy: "Process-lifetime JAX allocator peak through the final synchronized measured update; includes initialization, compilation, first call, and warmup and is not isolated activation memory."
failure_policy: "Retain every failed group. Explicit allocator diagnostics are classified as oom and the last entered phase distinguishes initialization, compilation, first update, warmup updates, measured updates, and post-measurement work. Signal-only termination is not labeled OOM."
sweep_policy: "Not a sweep: three registered E13-shaped workloads under one raised allocator fraction."
workloads:
  - id: unet_update_b8_r512
    kind: unet
    mode: update
    sweep_axes: [resolution]
    shape: {batch: 8, height: 512, width: 512}
    curvature: 0.1
    dtype: float32
  - id: unet_update_b16_r512
    kind: unet
    mode: update
    sweep_axes: []
    shape: {batch: 16, height: 512, width: 512}
    curvature: 0.1
    dtype: float32
  - id: unet_update_b8_r256
    kind: unet
    mode: update
    sweep_axes: [batch, resolution]
    shape: {batch: 8, height: 256, width: 256}
    curvature: 0.1
    dtype: float32
