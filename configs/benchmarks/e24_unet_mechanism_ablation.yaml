schema_version: "1.0"
experiment_id: E24
description: "Paired materialized-patch mechanism ablation for the complete U-Net with XLA_PYTHON_CLIENT_MEM_FRACTION=0.95 and preallocation disabled by scripts/run_e24.sh."
campaign_scope: "Separate the cost of pointwise patch geometry from explicit patch materialization and fused convolution execution."
variants: [R, M, F]
sessions: 5
warmup_calls: 50
timed_calls_per_session: 200
require_idle_gpu: true
max_preexisting_memory_mib: 512
max_preexisting_utilization_percent: 5
shared_state_policy: "Within each session, R/M/F receive identical deterministic parameters, inputs, targets, curvature, and optimizer state."
ablation_contract: "R materializes and ball-maps each beta-scaled patch; M materializes the identical patch but computes its exact score from tangent patch energy and directional products; F computes the same statistics with fused convolutions and no explicit patch."
timing_scope: "Compilation and the first compiled call are recorded but excluded from steady-state latency. Every measured call is synchronized. Complete updates include loss, reverse-mode gradients, gradient clipping, coupled L2, and Adam."
memory_evidence_policy: "Process-lifetime JAX allocator peak through the final synchronized measured call; includes initialization, compilation, first call, and warmup and is not isolated activation memory."
allocator_policy: "XLA_PYTHON_CLIENT_MEM_FRACTION=0.95 and XLA_PYTHON_CLIENT_PREALLOCATE=false."
workloads:
  - id: unet_b1_forward
    kind: unet
    mode: forward
    shape: {batch: 1, height: 256, width: 256}
    curvature: 0.1
    dtype: float32
  - id: unet_b8_forward
    kind: unet
    mode: forward
    shape: {batch: 8, height: 256, width: 256}
    curvature: 0.1
    dtype: float32
  - id: unet_b8_update
    kind: unet
    mode: update
    shape: {batch: 8, height: 256, width: 256}
    curvature: 0.1
    dtype: float32
