  - version: "1.4"
    date: "2026-09-07"
    affected_experiments: [E06, E07, E08, E10, E11, E12, E13]
    reason: "Use the scalar additive identity for average pooling so JAX 0.4.25 dispatches its differentiable reduce-window-sum primitive; the averaging equation and forward computation are unchanged."
    case_manifest_changed: false
  - version: "1.5"
    date: "2026-09-07"
    affected_experiments: [E02, E03, E04, E05, E06, E07, E08, E09, E10, E11, E12, E13, E14]
    reason: "Correct the smooth all-zero score Jacobian and projection origin derivative consistently in R/F/T; use a backward-stable norm rule and separate fixed-margin from dtype-default high-precision oracle comparisons."
    case_manifest_changed: true
  - version: "1.6"
    date: "2026-09-10"
    affected_experiments: [E08, E11, E12, E13]
    reason: "Dereference each completed benchmark output before invoking the next call so process-lifetime peak memory is not inflated by accidental Python retention; retain only the final output for finite-value validation. Timing boundaries and model mathematics are unchanged."
    case_manifest_changed: false
  - version: "1.7"
    date: "2026-09-10"
    affected_experiments: [E08, E11]
    reason: "Prioritize the registered complete Poincare U-Net inference and optimizer-step workloads plus its full-model profile as the bounded model-level gain gate. ResNet, dense, standalone backward, and broader profiles are deferred until this gate is interpreted; variants and measurement counts are unchanged."
    case_manifest_changed: false
  - version: "1.8"
    date: "2026-09-10"
    affected_experiments: [E07, E08, E09, E10, E12, E13, E14]
    reason: "Materialize Adam hyperparameters in each array leaf's dtype so state-evolving FP32 computations remain FP32 when the FP64 oracle is enabled globally. This fixes a compiled-signature mismatch after the first update; the optimizer equations, clipping policy, and experiment workloads are unchanged."
    case_manifest_changed: false
  - version: "1.9"
    date: "2026-09-12"
    affected_experiments: [E06, E09, E10, E14]
    reason: "Before any fixed-budget training run began, designate F as the primary optimized method after corrected E08 showed equivalent F/T update speed while F used less peak live memory. Add F to the predeclared R/T task-quality matrix and retain T as a mechanistic ablation; seeds, datasets, models, optimizer settings, and update budgets are unchanged."
    case_manifest_changed: true
  - version: "1.10"
    date: "2026-09-12"
    affected_experiments: [E09, E10, E14]
    reason: "Create one JIT evaluation callable per fresh training worker and reuse its compiled batch-shape executables across epochs and final endpoints. This removes redundant per-epoch compilation; evaluation equations, batch grouping, current-batch normalization, predictions, metrics, checkpoints, and all training updates are unchanged."
    case_manifest_changed: false
  - version: "1.11"
    date: "2026-09-28"
    affected_experiments: [E13]
    reason: "Before E13 execution, replace the older R/T capacity wording with the reference-versus-primary R/F comparison selected after corrected E08. Restrict E13 to the prespecified one-factor Poincare U-Net complete-update batch and resolution sweeps; retain every planned case and any failure or OOM. The model, loss, optimizer, precision, timing boundary, session count, warmup count, and observation count are unchanged."
    case_manifest_changed: true
  - version: "1.12"
    date: "2026-10-07"
    affected_experiments: [E12, E20, E21]
    reason: "Before any extension run, freeze a prospective R/F-only replication cohort of 15 new matched seeds per task and a bounded R/F CUDA-12 portability timing matrix. The new training cohort is analyzed separately from the completed five-seed V100 study, has no interim endpoint stopping or seed replacement, and is not silently pooled across platforms. T remains an ablation and is not extended."
    case_manifest_changed: true
  - version: "1.13"
    date: "2026-10-07"
    affected_experiments: [E12, E20, E21]
    reason: "After the retained pre-update E20/JAX 0.5.3 compile failure, lower the U-Net's kernel-equals-stride, zero-padding transpose fold as an exact reshape and transpose instead of four disjoint scatter-adds. The general overlapping fold is unchanged. Targeted forward, cotangent-gradient, and complete-update checks are required before restarting the frozen campaigns; no failed seed is replaced."
    case_manifest_changed: false
  - version: "1.14"
    date: "2026-10-07"
    affected_experiments: [E20, E21]
    reason: "The protocol-1.13 disjoint-fold lowering passed bitwise value/gradient checks but did not resolve the retained JAX 0.5.3 GPU compiler failure and is reverted before accepted training. Freeze E20/E21 to the unchanged scientific implementation and the original JAX/JAXLIB 0.4.25 CUDA-11.8 user-space stack on one RTX A6000. Exact batch-2/256 backward and complete-update diagnostics compiled and completed finitely before restart. E12 remains a separate unrun CUDA-12 portability experiment."
    case_manifest_changed: false

