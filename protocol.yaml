tasks:
  isic16_poincare_unet:
    model: {levels: 4, initial_width: 8, decoder: transpose_convolution}
    input: {height: 256, width: 256, channels: 3, scaling: zero_to_one}
    classes: 2
    normalization: {kind: poincare_midpoint_batch_norm, epsilon: 1.0e-6}
    curvature: {trainable: true, initial_magnitude: 0.1, transform: softplus}
    optimizer:
      name: adam
      learning_rate: 0.001
      weight_decay: 0.0001
      weight_decay_mode: coupled_l2
      scheduler: none
      gradient_clip_global_norm: 1.0
      parameter_coordinates: euclidean_source_coordinates
    loss:
      name: dice_plus_focal
      dice_weight: 1.0
      focal_weight: 1.0
      dice_classes: [0, 1]
      dice_aggregation: batch_and_spatial_per_class_then_class_mean
      dice_smoothing: 1.0e-6
      dice_denominator_epsilon: 1.0e-7
      focal_mode: summed_one_vs_all_binary_logits
      focal_alpha: 0.25
      focal_gamma: 2.0
    batch_size: 8
    epochs: 50
    max_updates: 5100
    remainder_handling: variable_shape_keep_all
    evaluation_batch_size: 8
    evaluation_order: manifest_order
    augmentation: none
    primary_metric: mean_per_image_foreground_dice
  cifar100_poincare_resnet20:
    model: {channels: [8, 16, 32], blocks_per_group: [3, 3, 3], skip_order: fr}
    input: {height: 32, width: 32, channels: 3, normalization: minus_one_to_one}
    classes: 100
    normalization: {kind: poincare_midpoint_batch_norm, epsilon: 1.0e-6}
    curvature: {trainable: false, initial_magnitude: 0.1, transform: identity}
    optimizer:
