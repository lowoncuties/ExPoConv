  primary: float32
  reduced_precision_enabled: false
  matmul_precision: highest
  tf32: false

projection:
  preserve_source_projection: true
  float32_relative_margin: 0.004
  float64_relative_margin: 0.00001
  report_clip_count: true

numerics:
  configurations: 100
  realizations_per_configuration: 10
  norm_floor: 1.0e-12
  curvatures: [0.001, 0.1, 1.0, 10.0]
  normalized_radii: [0.0, 1.0e-6, 0.1, 0.5, 0.9, 0.99, 0.9999, 0.999999]
  finite_difference_relative_steps: [0.0001, 0.00001, 0.000001]
  structured_config: "configs/numerics/e02_structured.yaml"
  repair_config: "configs/numerics/e02_repair.yaml"
  repair_structured_config: "configs/numerics/e02_repair_structured.yaml"
