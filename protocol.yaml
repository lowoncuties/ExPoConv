  structured_scope: "isolated layer, two/eight-layer stacks, Conv-BN-ReLU, beta skip, ordered residual, transpose decoder, decoder block, and small U-Net"
  tolerances:
    float64: {absolute: 1.0e-10, relative: 1.0e-10}
    float32: {absolute: 2.0e-5, relative: 2.0e-5}

timing:
  sessions: 5
  warmup_calls: 50
  timed_calls_per_session: 200
  synchronize_full_state: true
  fresh_process_per_variant: true
  randomized_order: true
  checkpointing_policy: "disabled"
  require_idle_gpu: true
  max_preexisting_memory_mib: 512
  max_preexisting_utilization_percent: 5
  output_retention_policy: "dereference completed output before next invocation; retain only final output for validation"
  peak_memory_scope: "process lifetime including initialization, compilation, and warmup; not an isolated activation/workspace peak"

quality:
