protocol_amendments:
  - version: "1.1"
    date: "2026-09-06"
    affected_experiments: [E02, E06, E07, E08, E09, E10, E12, E13, E14]
    reason: "Preserve R's zero Jacobian convention at an all-zero HNN++ score vector."
    case_manifest_changed: false
  - version: "1.2"
    date: "2026-09-06"
    affected_experiments: [E03, E04, E05, E08, E11, E12, E13]
    reason: "Require zero competing compute processes and at most 5% pre-run GPU utilization; archive physical-GPU snapshots before and after every measurement process."
    case_manifest_changed: false
  - version: "1.3"
    date: "2026-09-06"
    affected_experiments: [E02]
    reason: "Freeze topology-level and directional finite-difference cases, and reject resumption across protocol, configuration, or code identities."
    case_manifest_changed: true
  - version: "1.4"
    date: "2026-09-07"
    affected_experiments: [E06, E07, E08, E10, E11, E12, E13]
    reason: "Use the scalar additive identity for average pooling so JAX 0.4.25 dispatches its differentiable reduce-window-sum primitive; the averaging equation and forward computation are unchanged."
    case_manifest_changed: false
  - version: "1.5"
    date: "2026-09-07"
    affected_experiments: [E02, E03, E04, E05, E06, E07, E08, E09, E10, E11, E12, E13, E14]
    reason: "Correct the smooth all-zero score Jacobian and projection origin derivative consistently in R/F/T; use a backward-stable norm rule and separate fixed-margin from dtype-default high-precision oracle comparisons."
    case_manifest_changed: true
  - version: "1.6"
    date: "2026-09-10"
    affected_experiments: [E08, E11, E12, E13]
    reason: "Dereference each completed benchmark output before invoking the next call so process-lifetime peak memory is not inflated by accidental Python retention; retain only the final output for finite-value validation. Timing boundaries and model mathematics are unchanged."
    case_manifest_changed: false
  - version: "1.7"
    date: "2026-09-10"
    affected_experiments: [E08, E11]
    reason: "Prioritize the registered complete Poincare U-Net inference and optimizer-step workloads plus its full-model profile as the bounded model-level gain gate. ResNet, dense, standalone backward, and broader profiles are deferred until this gate is interpreted; variants and measurement counts are unchanged."
    case_manifest_changed: false
  - version: "1.8"
    date: "2026-09-10"
    affected_experiments: [E07, E08, E09, E10, E12, E13, E14]
    reason: "Materialize Adam hyperparameters in each array leaf's dtype so state-evolving FP32 computations remain FP32 when the FP64 oracle is enabled globally. This fixes a compiled-signature mismatch after the first update; the optimizer equations, clipping policy, and experiment workloads are unchanged."
    case_manifest_changed: false
  - version: "1.9"
    date: "2026-09-12"
    affected_experiments: [E06, E09, E10, E14]
    reason: "Before any fixed-budget training run began, designate F as the primary optimized method after corrected E08 showed equivalent F/T update speed while F used less peak live memory. Add F to the predeclared R/T task-quality matrix and retain T as a mechanistic ablation; seeds, datasets, models, optimizer settings, and update budgets are unchanged."
    case_manifest_changed: true
  - version: "1.10"
    date: "2026-09-12"
    affected_experiments: [E09, E10, E14]
    reason: "Create one JIT evaluation callable per fresh training worker and reuse its compiled batch-shape executables across epochs and final endpoints. This removes redundant per-epoch compilation; evaluation equations, batch grouping, current-batch normalization, predictions, metrics, checkpoints, and all training updates are unchanged."
    case_manifest_changed: false
  - version: "1.11"
    date: "2026-09-28"
    affected_experiments: [E13]
    reason: "Before E13 execution, replace the older R/T capacity wording with the reference-versus-primary R/F comparison selected after corrected E08. Restrict E13 to the prespecified one-factor Poincare U-Net complete-update batch and resolution sweeps; retain every planned case and any failure or OOM. The model, loss, optimizer, precision, timing boundary, session count, warmup count, and observation count are unchanged."
    case_manifest_changed: true
  - version: "1.12"
    date: "2026-10-07"
    affected_experiments: [E12, E20, E21]
    reason: "Before any extension run, freeze a prospective R/F-only replication cohort of 15 new matched seeds per task and a bounded R/F CUDA-12 portability timing matrix. The new training cohort is analyzed separately from the completed five-seed V100 study, has no interim endpoint stopping or seed replacement, and is not silently pooled across platforms. T remains an ablation and is not extended."
    case_manifest_changed: true
  - version: "1.13"
    date: "2026-10-07"
    affected_experiments: [E12, E20, E21]
    reason: "After the retained pre-update E20/JAX 0.5.3 compile failure, lower the U-Net's kernel-equals-stride, zero-padding transpose fold as an exact reshape and transpose instead of four disjoint scatter-adds. The general overlapping fold is unchanged. Targeted forward, cotangent-gradient, and complete-update checks are required before restarting the frozen campaigns; no failed seed is replaced."
    case_manifest_changed: false
  - version: "1.14"
    date: "2026-10-07"
    affected_experiments: [E20, E21]
    reason: "The protocol-1.13 disjoint-fold lowering passed bitwise value/gradient checks but did not resolve the retained JAX 0.5.3 GPU compiler failure and is reverted before accepted training. Freeze E20/E21 to the unchanged scientific implementation and the original JAX/JAXLIB 0.4.25 CUDA-11.8 user-space stack on one RTX A6000. Exact batch-2/256 backward and complete-update diagnostics compiled and completed finitely before restart. E12 remains a separate unrun CUDA-12 portability experiment."
    case_manifest_changed: false
  - version: "1.15"
    date: "2026-10-16"
    affected_experiments: [E22, E23, E24, E25, E26, E27]
    reason: "Before inspecting revision-extension outcomes, freeze six separately reported reviewer-requested checks. E22 tests allocator sensitivity at fraction 0.95 and adds a batch-16/512 workload expected to exceed physical memory. E23 tests whether batch-one forward allocation changes when GPU convolution autotuning is disabled. E24 adds benchmark-only M, which materializes R's identical beta-scaled tangent patch but evaluates the exact HNN++ score from patch energy and directional products, so R-versus-M isolates elementwise patch geometry and M-versus-F isolates explicit patch materialization from fused convolutions. E25 adds contextual E, which uses parameter-shape-matched Euclidean convolution/dense layers, current-batch Euclidean normalization over the same axes, ordinary skip concatenation/addition, and the same FC-plus-fold decoder topology without curvature. E26 is a fresh post-repair structured replay reporting elementwise relative-error quantiles without replacing the accepted E02 gate. E27 is a separate RTX-A6000 current-JAX/CUDA-12 portability cohort and is not pooled with or substituted for the primary JAX-0.4.25/CUDA-11.8 results. None of these post-hoc extensions changes the registered R/F/T numerical or training matrices."
    case_manifest_changed: true
  - version: "1.16"
    date: "2026-10-16"
    affected_experiments: [E27]
    reason: "Before any E24--E27 A6000 outcome was generated, a clean-clone preflight aligned E27's configuration workload identifier with its protocol registration and explicitly fixed its allocator fraction at 0.95 with preallocation disabled. The preflight also required separate version/backend/device gates and environment captures for the pinned and current JAX stacks. Workload shape, variants, sessions, warmups, timed calls, and reporting policy are unchanged."
    case_manifest_changed: false
  - version: "1.17"
    date: "2026-10-16"
    affected_experiments: [E28]
    reason: "After inspecting the fresh E26 diagnostic, freeze a post-hoc replay-stability check for its only mixed-criterion exception pattern: the first three deterministic FP32 realizations of both original structured cases, repeated in three independent processes. E28 is descriptive, cannot replace E02 or E26, and is intended only to distinguish a stable replay result from process-to-process numerical sensitivity."
    case_manifest_changed: true
  - version: "1.18"
    date: "2026-10-18"
    affected_experiments: [E29, E30]
    reason: "Before any E29 or E30 outcome was generated, freeze two post-hoc reviewer-requested V100 checks on the primary JAX/JAXLIB 0.4.25 CUDA-11.8 stack under the default JAX allocator fraction with preallocation disabled, the conditions of E08 and E13. E29 times only the contextual Euclidean path E on the three E08 workloads and the seven E13 workloads, with workload definitions copied verbatim; it is an unpaired reference against the published R/F values, reported descriptively, and is not pooled with E25. E30 times paired R/F complete updates at batch 8 and 256-by-256 with U-Net initial width 16 and 32 through a new optional benchmark workload key whose absence leaves every earlier workload unchanged; it reports where the F advantage changes as channels widen and retains any OOM under the default cap. Protocol 1.17 is preserved verbatim as configs/protocols/protocol_1_17.yaml for the E24/E25/E27 exports whose configuration hashes bind it. No earlier result, registered matrix, or analysis is changed."
    case_manifest_changed: true
  - version: "1.19"
    date: "2026-10-18"
    affected_experiments: [E31]
    reason: "Before any E31 outcome was generated, freeze a post-hoc reviewer-requested gather-based reference control. R builds its explicit patch with jax.lax.conv_general_dilated_patches, which JAX 0.4.25 lowers to a grouped convolution with a one-hot filter followed by a patch transpose; the official HNN++ code instead concatenates shifted slices. Benchmark-only Rg and Mg are R and M with the same beta-scaled tangent patch built by zero padding and concatenating the kernel-offset strided slices directly in R's (kernel row, kernel column, channel) order; every operation after the patch is shared with R or M, and R, M, F, and T are unchanged. E31 times R, Rg, Mg, and F in the same paired randomized fresh-process sessions on the three E24 U-Net workloads and the E25 ResNet-20 batch-128 complete update, on the RTX A6000 and JAX/JAXLIB 0.4.25 CUDA-11.8 stack of E24/E25 with allocator fraction 0.95 and preallocation disabled. A separate compile-only memory_analysis capture of R, Rg, and F for the batch-8 U-Net update reports compiler temporary, argument, and output bytes, and a descriptive GPU check compares the R and Rg patch tensors and one compiled call of R with Rg and M with Mg for every E31 workload. Version 1.18 is reserved for the E29/E30 registration on a parallel branch and is not used here. Protocol 1.17 is preserved verbatim as configs/protocols/protocol_1_17.yaml for the E24/E25/E27 exports whose configuration hashes bind it. No earlier result, registered matrix, or analysis is changed."
    case_manifest_changed: true

